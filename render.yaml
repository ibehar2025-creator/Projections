services:
  - type: web
    name: stock-projection-lab
    runtime: node
    plan: free
    buildCommand: ""
    startCommand: npm start
    envVars:
      - key: FINNHUB_API_KEY
        sync: false
      - key: ALPHA_VANTAGE_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: SESSION_SECRET
        sync: false
